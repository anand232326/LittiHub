services:
  mongodb:
    image: mongo:8
    container_name: littihub-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: littihub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Enables AOF (Append Only File) persistence and sets a memory limit with LRU eviction
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data: